# PUBLIC DEPLOYMENT IS OFF BY DEFAULT.
# Run only after the owner explicitly approves public publication.
# Set repository variable ENABLE_PUBLIC_PAGES=true and configure Pages first.
name: Publish to GitHub Pages (manual, gated)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: vars.ENABLE_PUBLIC_PAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - name: Configure root or project Pages URLs
        run: node scripts/github-pages-config.mjs
      - run: npm run verify
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0; nested upload is SHA-pinned
        with:
          path: dist
  deploy:
    needs: build
    if: vars.ENABLE_PUBLIC_PAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
